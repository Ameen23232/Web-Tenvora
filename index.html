<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tènvora Group | البوابة الرقمية</title>
    
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--bg-deep);
            color: var(--text-high);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            transition: background-color 0.8s var(--ease-long), color 0.6s var(--ease-long);
            font-weight: 600;
        }

        :root {
            --primary: #78a0ff;
            --primary-glow: rgba(120, 160, 255, 0.4);
            --bg-deep: #05070a;
            --text-high: #f8fafc;
            --text-mid: #94a3b8;
            --accent: #c084fc;
            --menu-bg: rgba(10, 10, 10, 0.6);
            --mesh-gradient: radial-gradient(circle at 50% 50%, #0f172a 0%, #05070a 100%);
            --glass-base: rgba(255, 255, 255, 0.03);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --glass-border-dark: rgba(255, 255, 255, 0.02);
            --glass-shadow-color: rgba(0, 0, 0, 0.4);
            --glass-bg: linear-gradient(135deg, var(--glass-base) 0%, rgba(255, 255, 255, 0) 100%);
            --neon-glow-subtle: 0 0 4px var(--primary-glow), 0 0 2px var(--primary);
            --neon-glow-hover: 0 0 0 2px var(--primary), 0 0 16px var(--primary), 0 0 28px var(--primary-glow);
            --ease-long: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html { overflow-x: hidden; width: 100%; scroll-behavior: smooth; }

        body.mode-1 {
            --bg-deep: #f0f4f8; --text-high: #1e293b; --text-mid: #475569; --primary: #2563eb;
            --mesh-gradient: radial-gradient(circle, #e2e8f0 0%, #f0f4f8 100%);
            --menu-bg: rgba(255,255,255,0.6); --primary-glow: rgba(37,99,235,0.3);
            --glass-base: rgba(0, 0, 0, 0.03); --glass-highlight: rgba(0, 0, 0, 0.1);
            --glass-border-dark: rgba(0, 0, 0, 0.02); --glass-shadow-color: rgba(0, 0, 0, 0.05);
        }
        body.mode-2 { --primary: #ff9800; --bg-deep: #211a2d; --text-high: #fff1e1; --text-mid: #d1b8c1; --mesh-gradient: linear-gradient(135deg, #2d1b2d 0%, #211a2d 100%); --primary-glow: rgba(255,152,0,0.4); }
        body.mode-3 { --primary: #00e5ff; --bg-deep: #0a0e1a; --text-high: #e0f2f1; --text-mid: #90a4ae; --mesh-gradient: radial-gradient(circle, #0f1c3a 0%, #0a0e1a 100%); --primary-glow: rgba(0,229,255,0.4); }
        body.mode-4 { --primary: #4caf50; --bg-deep: #0a110a; --text-high: #f1f8e9; --text-mid: #78909c; --mesh-gradient: linear-gradient(135deg, #101910 0%, #0a110a 100%); --primary-glow: rgba(76,175,80,0.4); }
        body.mode-5 { --primary: #a855f7; --bg-deep: #0f071a; --text-high: #faf5ff; --text-mid: #d8b4fe; --mesh-gradient: radial-gradient(circle, #2e1065 0%, #0f071a 100%); --primary-glow: rgba(168,85,247,0.4); }
        body.mode-6 { --primary: #fda4af; --bg-deep: #1e1b1e; --text-high: #fff1f2; --text-mid: #f43f5e; --mesh-gradient: radial-gradient(circle, #3d2b2d 0%, #1e1b1e 100%); --primary-glow: rgba(253,164,175,0.4); }
        body.mode-7 { --primary: #f59e0b; --bg-deep: #1c1917; --text-high: #fffbeb; --text-mid: #d97706; --mesh-gradient: linear-gradient(to bottom, #451a03, #1c1917); --primary-glow: rgba(245,158,11,0.4); }
        body.mode-8 { --primary: #2dd4bf; --bg-deep: #021a1a; --text-high: #f0fdfa; --text-mid: #5eead4; --mesh-gradient: radial-gradient(circle, #042f2e 0%, #021a1a 100%); --primary-glow: rgba(45,212,191,0.4); }
        body.mode-9 { --primary: #94a3b8; --bg-deep: #0f172a; --text-high: #f1f5f9; --text-mid: #64748b; --mesh-gradient: radial-gradient(circle, #1e293b 0%, #0f172a 100%); --primary-glow: rgba(148,163,184,0.4); }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none !important; -webkit-tap-highlight-color: transparent; }

        .mesh-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: var(--mesh-gradient);
            transition: background 1s var(--ease-long);
        }

        /* ========== Animated Particles ========== */
        .particles-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat linear infinite;
            box-shadow: 0 0 6px var(--primary-glow), 0 0 12px var(--primary-glow);
        }

        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 0.8; }
            90% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1.5); }
        }

        /* ========== Orbital Rings ========== */
        .orbital-system {
            position: absolute;
            width: 600px;
            height: 600px;
            pointer-events: none;
            z-index: 0;
        }

        .orbit-ring {
            position: absolute;
            border: 1px solid rgba(120, 160, 255, 0.06);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        .orbit-ring:nth-child(1) { width: 300px; height: 300px; animation: orbitSpin 25s linear infinite; }
        .orbit-ring:nth-child(2) { width: 420px; height: 420px; animation: orbitSpin 35s linear infinite reverse; }
        .orbit-ring:nth-child(3) { width: 540px; height: 540px; animation: orbitSpin 50s linear infinite; }

        .orbit-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary-glow);
        }

        @keyframes orbitSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* ========== Theme Control ========== */
        .theme-control {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2001;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .theme-toggle {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border-dark);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            width: 50px;
            height: 50px;
            backdrop-filter: blur(16px);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--glass-shadow-color), var(--neon-glow-subtle);
            transition: transform 0.25s var(--ease-long), box-shadow 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.05) rotate(5deg);
            border-color: var(--primary);
            box-shadow: 0 6px 18px var(--glass-shadow-color), var(--neon-glow-hover);
        }

        .theme-dropdown {
            background: var(--menu-bg);
            border: 1px solid var(--glass-border-dark);
            border-radius: 20px;
            backdrop-filter: blur(24px);
            position: absolute;
            top: 65px;
            left: 0;
            width: 250px;
            box-shadow: 0 8px 32px 0 var(--glass-shadow-color);
            overflow-y: auto;
            max-height: 0;
            opacity: 0;
            transform: translateY(-20px);
            transition: 0.4s var(--ease-long);
            visibility: hidden;
        }

        .theme-control.active .theme-dropdown {
            max-height: 450px;
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
        }

        .dropdown-item {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-mid);
            text-decoration: none;
            border-bottom: 1px solid var(--glass-border-dark);
            transition: all 0.25s var(--ease-long);
            font-weight: 700;
        }

        .dropdown-item:hover {
            background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent);
            color: var(--text-high);
            padding-right: 25px;
        }

        /* ========== Navbar ========== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(180deg, var(--menu-bg) 0%, transparent 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-highlight);
        }

        .nav-logo {
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 900;
            color: var(--primary);
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--primary-glow);
            cursor: default;
            transition: text-shadow 0.3s var(--ease-long), color 0.3s var(--ease-long), transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .nav-logo:hover {
            transform: scale(1.02);
            text-shadow: 0 0 12px var(--primary), 0 0 22px var(--primary-glow);
        }

        /* ========== Main Content ========== */
        .main-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 20px;
        }

        /* ========== Logo ========== */
        .logo-glow {
            font-size: clamp(60px, 18vw, 180px);
            font-weight: 950;
            background: linear-gradient(180deg, var(--text-high), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px var(--primary-glow));
            animation: float 5s ease-in-out infinite;
            cursor: default;
            opacity: 0;
            transform: translateY(50px) scale(0.9);
            transition: opacity 1s ease, transform 1s ease;
        }

        .logo-glow.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 8px var(--primary-glow)); }
            50% { transform: translateY(-12px); filter: drop-shadow(0 12px 20px var(--primary-glow)); }
        }

        /* ========== Subtitle ========== */
        .subtitle {
            font-size: clamp(16px, 3.5vw, 22px);
            color: var(--text-mid);
            font-weight: 700;
            max-width: 600px;
            text-shadow: 0 0 6px var(--primary-glow);
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
            cursor: default;
        }

        .subtitle.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .subtitle:hover {
            transform: scale(1.02);
            text-shadow: 0 0 12px var(--primary), 0 0 22px var(--primary-glow);
            color: var(--primary);
            transition: all 0.25s var(--ease-long);
        }

        /* ========== Divider Line ========== */
        .divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            border-radius: 2px;
            opacity: 0;
            transform: scaleX(0);
            transition: opacity 0.6s ease 0.5s, transform 0.6s ease 0.5s;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .divider.visible {
            opacity: 1;
            transform: scaleX(1);
        }

        /* ========== CTA Button ========== */
        .cta-wrapper {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease 0.7s, transform 0.8s ease 0.7s;
        }

        .cta-wrapper.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .btn-portal {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 22px 60px;
            border-radius: 100px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            color: var(--text-high);
            text-decoration: none;
            font-weight: 900;
            font-size: clamp(16px, 3vw, 20px);
            border: 1px solid var(--glass-border-dark);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            box-shadow: 0 6px 14px var(--glass-shadow-color), var(--neon-glow-subtle);
            transition: transform 0.35s var(--ease-long), box-shadow 0.35s ease, background 0.35s ease, border-color 0.35s ease, color 0.35s ease;
            cursor: pointer;
            overflow: hidden;
            isolation: isolate;
        }

        .btn-portal::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg);
            transition: 0.6s;
            z-index: -1;
        }

        .btn-portal::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 100px;
            background: conic-gradient(from 0deg, var(--primary), var(--accent), var(--primary));
            z-index: -2;
            opacity: 0;
            transition: opacity 0.4s ease;
            animation: borderRotate 3s linear infinite;
        }

        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-portal:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 8px 28px var(--glass-shadow-color), var(--neon-glow-hover);
            transform: translateY(-6px) scale(1.04);
        }

        .btn-portal:hover::before {
            left: 150%;
            transition: 0.7s;
        }

        .btn-portal:hover::after {
            opacity: 0.6;
        }

        .btn-portal:active {
            transform: translateY(-2px) scale(0.98);
            transition: transform 0.1s;
        }

        /* Arrow icon animation */
        .btn-arrow {
            display: inline-flex;
            transition: transform 0.35s var(--ease-long);
        }

        .btn-portal:hover .btn-arrow {
            transform: translateX(-6px);
            animation: arrowPulse 0.8s ease-in-out infinite;
        }

        @keyframes arrowPulse {
            0%, 100% { transform: translateX(-6px); }
            50% { transform: translateX(-12px); }
        }

        /* Ripple effect */
        .btn-ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ========== Pulse ring behind button ========== */
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--primary);
            border-radius: 100px;
            opacity: 0;
            animation: pulseRingAnim 2.5s ease-out infinite;
            pointer-events: none;
        }

        .pulse-ring:nth-child(2) { animation-delay: 0.8s; }
        .pulse-ring:nth-child(3) { animation-delay: 1.6s; }

        @keyframes pulseRingAnim {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* ========== Footer ========== */
        .footer-text {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.4;
            font-size: 12px;
            font-weight: 800;
            color: var(--text-mid);
            cursor: default;
            text-shadow: 0 0 6px var(--primary-glow);
            transition: opacity 0.3s ease, color 0.3s ease;
            z-index: 1;
            white-space: nowrap;
        }

        .footer-text:hover {
            opacity: 0.8;
            color: var(--primary);
        }

        /* ========== Ambient Glow ========== */
        .ambient-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            animation: ambientDrift 12s ease-in-out infinite alternate;
            filter: blur(60px);
        }

        .ambient-glow.glow-1 {
            top: -150px;
            right: -100px;
            animation-duration: 12s;
        }

        .ambient-glow.glow-2 {
            bottom: -200px;
            left: -150px;
            animation-duration: 16s;
            animation-delay: 3s;
            width: 400px;
            height: 400px;
            opacity: 0.1;
        }

        @keyframes ambientDrift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.15); }
            100% { transform: translate(-20px, -15px) scale(0.95); }
        }

        /* ========== Mouse Follower ========== */
        .mouse-follower {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            opacity: 0.08;
            filter: blur(40px);
            transform: translate(-50%, -50%);
            transition: left 0.5s ease, top 0.5s ease, opacity 0.3s ease;
        }

        /* ========== Responsive ========== */
        @media (max-width: 600px) {
            .btn-portal {
                padding: 18px 40px;
                width: 90%;
                justify-content: center;
            }

            .orbital-system {
                width: 350px;
                height: 350px;
            }

            .orbit-ring:nth-child(1) { width: 180px; height: 180px; }
            .orbit-ring:nth-child(2) { width: 260px; height: 260px; }
            .orbit-ring:nth-child(3) { width: 340px; height: 340px; }

            .ambient-glow { width: 300px; height: 300px; }
        }

        @media (max-width: 380px) {
            .btn-portal {
                padding: 16px 30px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="mesh-bg"></div>

    <!-- Ambient Glow Effects -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Mouse Follower -->
    <div class="mouse-follower" id="mouseFollower"></div>

    <!-- Particles -->
    <div class="particles-container" id="particlesContainer"></div>

    <!-- Theme Control -->
    <div class="theme-control" id="themeCtrl">
        <button class="theme-toggle" onclick="document.getElementById('themeCtrl').classList.toggle('active')">
            <svg viewBox="0 0 24 24" width="24" fill="var(--text-high)">
                <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 7a5 5 0 100 10 5 5 0 000-10z" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
        </button>
        <div class="theme-dropdown">
            <a href="#" class="dropdown-item" onclick="setTheme(0)">🌑 الفضاء العميق</a>
            <a href="#" class="dropdown-item" onclick="setTheme(1)">☀️ النقاء العصري</a>
            <a href="#" class="dropdown-item" onclick="setTheme(2)">🌅 الشفق الساحر</a>
            <a href="#" class="dropdown-item" onclick="setTheme(3)">🌊 نبض المحيط</a>
            <a href="#" class="dropdown-item" onclick="setTheme(4)">🌿 واحة الهدوء</a>
            <a href="#" class="dropdown-item" onclick="setTheme(5)">🔮 سحر البنفسج</a>
            <a href="#" class="dropdown-item" onclick="setTheme(6)">🌸 وردي نورديك</a>
            <a href="#" class="dropdown-item" onclick="setTheme(7)">🔥 شروق الشمس</a>
            <a href="#" class="dropdown-item" onclick="setTheme(8)">💎 نعناع سايبر</a>
            <a href="#" class="dropdown-item" onclick="setTheme(9)">🔘 رمادي مينيمال</a>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-logo">TÈNVORA</div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Orbital System -->
        <div class="orbital-system">
            <div class="orbit-ring"><div class="orbit-dot"></div></div>
            <div class="orbit-ring"><div class="orbit-dot"></div></div>
            <div class="orbit-ring"><div class="orbit-dot"></div></div>
        </div>

        <h1 class="logo-glow" id="logo">Tènvora</h1>

        <p class="subtitle" id="subtitle">افضل جوده افضل سعر واسرع تسليم واكثر ضمان</p>

        <div class="divider" id="divider"></div>

        <div class="cta-wrapper" id="ctaWrapper" style="position: relative;">
            <!-- Pulse Rings -->
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>

            <a href="https://tenvora.online" target="_blank" class="btn-portal" id="btnPortal" onclick="createRipple(event)">
                <span class="btn-arrow">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5"/>
                        <path d="M12 19l-7-7 7-7"/>
                    </svg>
                </span>
                <span>ادخل إلى Tènvora</span>
            </a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-text">Tènvora Group © 2026 — حيث تولد الامتيازات الرقمية</div>

    <script>
        // ============= Entrance Animations =============
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('logo').classList.add('visible');
            }, 200);
            setTimeout(function() {
                document.getElementById('subtitle').classList.add('visible');
            }, 500);
            setTimeout(function() {
                document.getElementById('divider').classList.add('visible');
            }, 700);
            setTimeout(function() {
                document.getElementById('ctaWrapper').classList.add('visible');
            }, 900);
        });

        // ============= Ripple Effect on Button =============
        function createRipple(event) {
            var btn = document.getElementById('btnPortal');
            var circle = document.createElement('span');
            var diameter = Math.max(btn.clientWidth, btn.clientHeight);
            var radius = diameter / 2;
            var rect = btn.getBoundingClientRect();

            circle.style.width = circle.style.height = diameter + 'px';
            circle.style.left = (event.clientX - rect.left - radius) + 'px';
            circle.style.top = (event.clientY - rect.top - radius) + 'px';
            circle.classList.add('btn-ripple');

            var existingRipple = btn.querySelector('.btn-ripple');
            if (existingRipple) existingRipple.remove();

            btn.appendChild(circle);
        }

        // ============= Particle System =============
        function createParticles() {
            var container = document.getElementById('particlesContainer');
            var particleCount = window.innerWidth < 600 ? 25 : 50;

            for (var i = 0; i < particleCount; i++) {
                var particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 3 + 1) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDuration = (Math.random() * 12 + 8) + 's';
                particle.style.animationDelay = (Math.random() * 15) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // ============= Mouse Follower =============
        var follower = document.getElementById('mouseFollower');
        var isTouchDevice = 'ontouchstart' in window;

        if (!isTouchDevice) {
            document.addEventListener('mousemove', function(e) {
                follower.style.left = e.clientX + 'px';
                follower.style.top = e.clientY + 'px';
                follower.style.opacity = '0.08';
            });

            document.addEventListener('mouseleave', function() {
                follower.style.opacity = '0';
            });
        } else {
            follower.style.display = 'none';
        }

        // ============= Theme System =============
        function setTheme(modeIndex) {
            document.body.className = modeIndex !== 0 ? 'mode-' + modeIndex : '';
            document.getElementById('themeCtrl').classList.remove('active');
        }

        // ============= Close Theme on Outside Click =============
        window.addEventListener('click', function(e) {
            if (!document.getElementById('themeCtrl').contains(e.target)) {
                document.getElementById('themeCtrl').classList.remove('active');
            }
        });
    </script>
</body>
</html>
